services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: finpilot
      POSTGRES_USER: finpilot
      POSTGRES_PASSWORD: finpilot-local-only
    ports:
      - "5432:5432"
    volumes:
      - finpilot_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finpilot -d finpilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # NOTE: MinIO removed its Docker Hub namespace on 2026-09-11 (permanent upstream
  # change). Uncomment and replace with an S3-compatible alternative when file
  # storage is needed (e.g. localstack, seaweedfs, or a managed S3 bucket).
  # minio:
  #   image: minio/minio:latest
  #   restart: unless-stopped
  #   command: server /data --console-address ":9001"
  #   environment:
  #     MINIO_ROOT_USER: finpilot-local
  #     MINIO_ROOT_PASSWORD: finpilot-local-secret
  #   ports:
  #     - "9000:9000"
  #     - "9001:9001"
  #   volumes:
  #     - finpilot_minio:/data

volumes:
  finpilot_pg:

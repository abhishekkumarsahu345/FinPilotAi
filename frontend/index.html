<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#f5f7f6"/>
  <title>FinPilot AI - Receivables</title>
  <!--
    Anti-flash theme script: runs synchronously before any paint.
    Sets data-theme on <html> from localStorage or system preference
    so there is never a flash of the wrong theme on page load.
  -->
  <script>
    (function(){
      try {
        var m = document.querySelector('meta[name="theme-color"]');
        var stored = localStorage.getItem('finpilot_theme');
        var theme = (stored === 'dark' || stored === 'light')
          ? stored
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
        if (m) m.content = theme === 'dark' ? '#131c18' : '#f5f7f6';
      } catch(e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
